<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="description" content="Word Zap: a kids' spelling game. Fly Captain Cubby from Mercury to Neptune and type picture words to zap asteroids.">
<meta name="theme-color" content="#0b0f2a">
<style>[hidden]{display:none!important} *,*::before,*::after{box-sizing:border-box} img{max-width:100%}</style>
<title>Word Zap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: full-bleed cockpit. The canvas is the windscreen; the pilot's dashboard docks at the bottom with the bear and the typing console. */
:root{
  --space:#0b0f2a; --space-2:#151a45; --hull:#1f2550; --hull-edge:#3a4384;
  --honey:#f6b54a; --laser:#5ff2c2; --danger:#ff6b6b; --ink:#eef0ff; --muted:#9aa2d6;
  --display:"Fredoka","Baloo 2",ui-rounded,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--space);color:var(--ink);font-family:var(--body);overflow:hidden;margin:0;-webkit-tap-highlight-color:transparent}
#game{position:fixed;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;will-change:transform}
/* keyboard open: the game is squeezed into the space above it, so tighten everything */
#game.kb .dash{padding-block:6px 6px;gap:8px}
#game.kb .console{gap:5px}
#game.kb .bubble{font-size:13px}
#game.kb #word{font-size:22px;padding:3px 10px;border-radius:12px}
/* Cubby's console keyboard: used on touch screens instead of the phone keyboard */
.keys{display:none;flex-direction:column;gap:6px;padding-top:2px}
#game.touch .keys{display:flex}
#game.touch .bubble{font-size:14px}
#game.touch #word{font-size:24px;padding:3px 10px;caret-color:transparent}
.krow{display:flex;gap:5px;justify-content:center}
.key{flex:1 1 0;min-width:0;max-width:48px;height:46px;border:0;border-radius:11px;background:#323b78;color:var(--ink);
  font-family:var(--body);font-weight:700;font-size:21px;box-shadow:0 3px 0 #171c44;cursor:pointer;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;padding:0}
.key.down{transform:translateY(2px);box-shadow:0 1px 0 #171c44;background:#4a55a8}
.key.del{flex:1.7 1 0;max-width:80px;background:#5b4a86;font-size:18px}
.key:focus-visible{outline:3px solid var(--laser);outline-offset:2px}
@media (max-height:680px){.key{height:40px;font-size:19px}}
@media (max-height:560px){.key{height:34px;font-size:17px}.keys{gap:4px}}
#game.kb .power{height:6px}
#game.kb .hud{padding-top:calc(6px + env(safe-area-inset-top,0px))}
#game.kb .hud .pill{padding:3px 10px;font-size:14px}
#game.kb .hud .btn.small{padding:3px 10px;font-size:13px}
#game.kb .journey{font-size:12px}
#view{flex:1;position:relative;min-height:0;cursor:text}
#sky{position:absolute;inset:0;width:100%;height:100%;display:block}

.hud{position:absolute;top:0;left:0;right:0;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-top:calc(12px + env(safe-area-inset-top,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.hud .pill{background:rgba(11,15,42,.72);border:2px solid var(--hull-edge);border-radius:999px;padding:6px 14px;
  font-family:var(--display);font-weight:600;font-size:16px;display:flex;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.shields{display:flex;gap:4px}
.shields i{width:14px;height:18px;border-radius:7px 7px 9px 9px;background:var(--laser);box-shadow:0 0 8px var(--laser);display:block}
.shields i.off{background:var(--hull-edge);box-shadow:none}
.hud button{pointer-events:auto}
.hud{flex-wrap:wrap}
.journey{flex-basis:100%;display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:14px;color:var(--muted)}
.track{flex:1;min-width:0;margin-inline:12px;height:8px;border-radius:4px;background:rgba(58,67,132,.7);position:relative}
.track .fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:4px;background:linear-gradient(90deg,var(--laser),var(--honey));transition:width .4s}
.track .ship{position:absolute;top:50%;left:0;transform:translate(-50%,-50%);font-size:18px;transition:left .4s}
.journey .dest{color:var(--honey);white-space:nowrap}
.journey .spd{white-space:nowrap;font-variant-numeric:tabular-nums}

.btn{font-family:var(--display);font-weight:600;font-size:18px;border:0;border-radius:16px;padding:12px 22px;cursor:pointer;
  background:var(--honey);color:#2a1a05;box-shadow:0 4px 0 #b9792a;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b9792a}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:2px solid var(--hull-edge)}
.btn.small{font-size:15px;padding:6px 14px;border-radius:999px}
.btn:focus-visible,.lvl:focus-visible,#word:focus-visible{outline:3px solid var(--laser);outline-offset:3px}

.dash{background:linear-gradient(180deg,var(--hull),var(--space-2));border-top:3px solid var(--hull-edge);
  display:flex;gap:14px;align-items:center;
  padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pilot{flex:none;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#2c3570,#141838);
  border:3px solid var(--honey);overflow:hidden}
.pilot canvas{width:100%;height:100%;display:block}
.console{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.bubble{font-family:var(--display);font-weight:500;font-size:16px;color:var(--ink);min-height:1.3em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bubble b{color:var(--honey);font-weight:600}
.row{display:flex;gap:10px;align-items:center}
#word{flex:1;min-width:0;font-family:var(--body);font-weight:700;font-size:30px;letter-spacing:.18em;text-align:center;
  color:var(--laser);background:var(--space);border:3px solid var(--hull-edge);border-radius:16px;padding:6px 10px;
  text-transform:lowercase;caret-color:var(--laser)}
#word.bad{border-color:var(--danger);animation:wobble .25s}
@keyframes wobble{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.power{height:10px;border-radius:5px;background:var(--space);border:2px solid var(--hull-edge);overflow:hidden}
.power i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--honey),var(--laser));transition:width .12s}

.screen{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(16px + env(safe-area-inset-top,0px)) 16px;overflow:auto}
.card{background:rgba(15,19,52,.92);border:3px solid var(--hull-edge);border-radius:28px;padding:24px;max-width:520px;width:100%;
  display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.logo,.card h1{font-family:var(--display);font-weight:700;font-size:clamp(40px,10vw,64px);line-height:.95;margin:0;letter-spacing:.01em;
  color:var(--honey);text-shadow:0 4px 0 #8a4f12,0 0 30px rgba(246,181,74,.35)}
.logo span,.card h1 span{color:var(--laser);text-shadow:0 4px 0 #1b7a5c,0 0 30px rgba(95,242,194,.35)}
.card h2{font-family:var(--display);font-weight:700;font-size:34px;margin:0;color:var(--honey);text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:16px;line-height:1.5;max-width:40ch}
.card p strong{color:var(--ink)}
.levels{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;width:100%}
@media (max-width:720px){.levels{grid-template-columns:repeat(4,minmax(0,1fr))}}
.lvl{min-width:0;font-size:15px;font-weight:600;font-family:var(--display);background:rgba(11,15,42,.7);color:var(--ink);border:2px solid var(--hull-edge);border-radius:18px;
  padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;transition:transform .12s,border-color .12s}
.lvl canvas{width:56px;height:56px;display:block}
.lvl .n{font-size:15px;font-weight:600;white-space:nowrap}
.lvl.sel{transform:translateY(-4px);box-shadow:0 0 0 3px rgba(246,181,74,.25),0 8px 20px rgba(0,0,0,.35)}
.lvl .d{font-size:12px;color:var(--muted);font-family:var(--body)}
.lvl.sel{border-color:var(--honey);background:#2a2550}
.lvl .st{color:var(--honey);letter-spacing:2px}
.btn,.lvl{touch-action:manipulation;user-select:none;-webkit-user-select:none}
.toggle{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:15px;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--laser)}
.stars{font-size:44px;letter-spacing:6px;color:var(--honey)}
.stars .dim{color:var(--hull-edge)}
.learned{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.learned span{background:var(--space);border:2px solid var(--hull-edge);border-radius:12px;padding:4px 10px;font-weight:700}
.learned span.miss{border-color:var(--danger)}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
@media (max-width:420px){#word{font-size:24px}.bubble{font-size:14px}}
/* front screen: Cubby says hello, then pick a planet */
#game.at-title .dash{display:none}
.front{background:radial-gradient(ellipse at 50% 25%,rgba(30,36,96,.72),rgba(11,15,42,.94) 70%);align-items:flex-start}
.front-wrap{width:100%;max-width:780px;margin:auto;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-block:8px}
.hello{display:flex;align-items:center;justify-content:center;gap:4px;width:100%}
#cubby{width:clamp(150px,34vw,230px);height:auto;aspect-ratio:1;flex:none}
.speech{position:relative;background:#fff6e6;color:#2a1a05;border-radius:22px;padding:14px 18px;font-family:var(--display);font-weight:500;
  font-size:clamp(16px,3.6vw,21px);line-height:1.25;text-align:left;max-width:15em;min-width:0;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.speech::before{content:"";position:absolute;left:-12px;top:42%;border:12px solid transparent;border-left:0;border-right-color:#fff6e6}
.speech{display:flex;flex-direction:column;gap:10px;width:17em;max-width:100%;min-height:8.2em;cursor:pointer}
.speech b{display:block;font-weight:700;color:#b5651d;font-size:1.12em}
.speech .line{min-height:3.8em}
.speech .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.speech .dots{display:flex;gap:5px}
.speech .dots i{width:8px;height:8px;border-radius:50%;background:#e8cfa8;display:block}
.speech .dots i.on{background:#b5651d}
.speech .next{font-family:var(--display);font-weight:600;font-size:15px;border:0;border-radius:999px;padding:6px 14px;background:#3b5bd6;color:#fff;cursor:pointer;touch-action:manipulation}
.speech .next:focus-visible{outline:3px solid #b5651d;outline-offset:2px}
.logo{font-family:var(--display);font-weight:700;font-size:clamp(38px,9vw,60px);line-height:.95;margin:0}
.pick{margin:0;color:var(--muted);font-size:16px}
.pick strong{color:var(--honey)}
.front .btn{font-size:20px;padding:14px 28px}
.end-cubby{width:130px;height:130px;margin-bottom:-6px}
@media (prefers-reduced-motion:reduce){#word.bad{animation:none}}
</style>
</head>
<body>

<div id="game" class="at-title">
  <div id="view">
    <canvas id="sky" aria-label="View from the starship windscreen"></canvas>
    <div class="hud" id="hud" hidden>
      <div class="pill"><span id="lvlLabel">Level 1</span><span class="shields" id="shields" aria-label="Shields"></span></div>
      <div class="pill"><span id="score">0</span><button class="btn small ghost" id="pauseBtn" type="button">Pause</button></div>
      <div class="journey"><span class="spd" id="spd">Speed 1×</span><div class="track"><div class="fill" id="jfill"></div><span class="ship" id="jship">🚀</span></div><span class="dest" id="dest">Moon</span></div>
    </div>

    <div class="screen front" id="titleScreen">
      <div class="front-wrap">
        <div class="hello">
          <canvas id="cubby" width="440" height="440" role="img" aria-label="Captain Cubby the bear, waving hello"></canvas>
          <div class="speech" id="speech" aria-live="polite">
            <div class="line" id="speechLine"></div>
            <div class="foot"><span class="dots" id="speechDots"></span><button class="next" id="speechNext" type="button">Next ▸</button></div>
          </div>
        </div>
        <h1 class="logo">Word <span>Zap</span></h1>
        <div class="levels" id="levels" role="group" aria-label="Choose a planet"></div>
        <p class="pick" id="pickInfo"></p>
        <label class="toggle"><input type="checkbox" id="speak" checked> Say words out loud</label>
        <button class="btn" id="startBtn" type="button">Blast off!</button>
      </div>
    </div>

    <div class="screen" id="endScreen" hidden>
      <div class="card">
        <canvas class="end-cubby" id="cubbyEnd" width="300" height="300" aria-hidden="true"></canvas>
        <h2 id="endTitle">Level clear!</h2>
        <div class="stars" id="endStars"></div>
        <p id="endText"></p>
        <div class="learned" id="learned"></div>
        <div class="actions">
          <button class="btn ghost" id="menuBtn" type="button">Planets</button>
          <button class="btn" id="nextBtn" type="button">Next level</button>
        </div>
      </div>
    </div>

    <div class="screen" id="pauseScreen" hidden>
      <div class="card">
        <h2>Paused</h2>
        <div class="actions">
          <button class="btn ghost" id="quitBtn" type="button">Planets</button>
          <button class="btn" id="resumeBtn" type="button">Keep flying</button>
        </div>
      </div>
    </div>
  </div>

  <div class="dash">
    <form class="console" id="consoleForm" autocomplete="off">
      <div class="bubble" id="bubble">Captain Cubby here. Ready when you are!</div>
      <div class="row">
        <input id="word" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"
               aria-label="Type the word for the picture" placeholder="type here">
      </div>
      <div class="power" aria-hidden="true"><i id="power"></i></div>
      <div class="keys" id="keys" role="group" aria-label="Letter keys"></div>
    </form>
  </div>
</div>

<script>
(() => {
// ---------- word bank ----------
const LEVELS = [
  {name:"Cadet", desc:"3 letters", dest:"Mercury", col:["#cfcac2","#6e6a66"], look:"craters", max:1, pace:1.25, words:[["cat","🐱"],["dog","🐶"],["sun","☀️"],["car","🚗"],["bus","🚌"],["egg","🥚"],["hat","🎩"],["pig","🐷"],["cow","🐮"],["bee","🐝"],["ant","🐜"],["fox","🦊"],["owl","🦉"],["bed","🛏️"],["key","🔑"],["box","📦"]]},
  {name:"Pilot", desc:"4 letters", dest:"Venus", col:["#f6e0a8","#c08a42"], look:"haze", max:1, pace:1.15, words:[["ball","⚽"],["fish","🐟"],["cake","🍰"],["duck","🦆"],["frog","🐸"],["milk","🥛"],["moon","🌙"],["star","⭐"],["tree","🌳"],["book","📖"],["shoe","👟"],["bird","🐦"],["lion","🦁"],["corn","🌽"],["kite","🪁"],["boat","⛵"],["sock","🧦"]]},
  {name:"Navigator", desc:"5 letters", dest:"Earth", col:["#7cc4ff","#1f5fa8"], look:"earth", max:1, pace:1.1, words:[["apple","🍎"],["horse","🐴"],["train","🚆"],["house","🏠"],["chair","🪑"],["clock","🕐"],["bread","🍞"],["mouse","🐭"],["snake","🐍"],["tiger","🐯"],["zebra","🦓"],["grape","🍇"],["lemon","🍋"],["pizza","🍕"],["plane","✈️"],["sheep","🐑"],["whale","🐳"],["truck","🚚"]]},
  {name:"Captain", desc:"6 letters", dest:"Mars", col:["#ff9a6b","#a2412a"], look:"craters", max:2, pace:1.05, words:[["banana","🍌"],["rabbit","🐰"],["monkey","🐵"],["carrot","🥕"],["rocket","🚀"],["turtle","🐢"],["flower","🌸"],["cookie","🍪"],["pencil","✏️"],["orange","🍊"],["cheese","🧀"],["spider","🕷️"],["guitar","🎸"],["tomato","🍅"],["basket","🧺"],["castle","🏰"],["jacket","🧥"],["parrot","🦜"],["potato","🥔"],["camera","📷"]]},
  {name:"Major", desc:"7 letters", dest:"Jupiter", col:["#f2d2a6","#a8653a"], look:"bands", max:2, pace:1.0, words:[["rainbow","🌈"],["penguin","🐧"],["chicken","🐔"],["giraffe","🦒"],["bicycle","🚲"],["dolphin","🐬"],["octopus","🐙"],["pumpkin","🎃"],["lobster","🦞"],["unicorn","🦄"],["popcorn","🍿"],["volcano","🌋"],["cupcake","🧁"],["hamster","🐹"],["peacock","🦚"],["scooter","🛴"],["tractor","🚜"],["snowman","⛄"],["trumpet","🎺"]]},
  {name:"Commander", desc:"8 letters", dest:"Saturn", col:["#f6dc8f","#b08a3a"], look:"ring", max:2, pace:1.0, words:[["elephant","🐘"],["umbrella","☂️"],["kangaroo","🦘"],["broccoli","🥦"],["sandwich","🥪"],["dinosaur","🦕"],["hedgehog","🦔"],["mushroom","🍄"],["flamingo","🦩"],["pancakes","🥞"],["backpack","🎒"],["doughnut","🍩"],["scissors","✂️"],["lollipop","🍭"],["football","🏈"]]},
  {name:"Admiral", desc:"9 letters", dest:"Uranus", col:["#c4f4f2","#4fa9b8"], look:"tilt", max:3, pace:0.95, words:[["butterfly","🦋"],["crocodile","🐊"],["pineapple","🍍"],["telescope","🔭"],["snowflake","❄️"],["ambulance","🚑"],["astronaut","🧑‍🚀"],["chocolate","🍫"],["spaghetti","🍝"],["fireworks","🎆"],["hamburger","🍔"],["sunflower","🌻"]]},
  {name:"Space Hero", desc:"10+ letters", dest:"Neptune", col:["#8fb0ff","#2b3fa8"], look:"haze", max:3, pace:0.95, words:[["strawberry","🍓"],["watermelon","🍉"],["helicopter","🚁"],["microscope","🔬"],["skateboard","🛹"],["caterpillar","🐛"],["motorcycle","🏍️"],["toothbrush","🪥"],["basketball","🏀"],["television","📺"],["rhinoceros","🦏"],["grasshopper","🦗"]]}
];
const PER_LEVEL = 10, MAX_HP = 5, TOP_SPEED = 2.2; // last asteroid flies 2.2× faster than the first

// ---------- elements ----------
const $ = id => document.getElementById(id);
const sky = $("sky"), ctx = sky.getContext("2d");
const inp = $("word"), bubble = $("bubble"), powerBar = $("power");

let best = {};
try { best = JSON.parse(localStorage.getItem("wordzap-stars") || "{}") || {}; } catch(e) {}
let chosen = 0;

// ---------- state ----------
const S = { mode:"title", aim:0, recoil:0, zapT:0, level:0, spawned:0, prog:0, hp:MAX_HP, score:0, queue:[], resolved:0, rocks:[], typed:"",
  spawnTimer:0, shake:0, flash:0, beams:[], parts:[], log:[], mood:"idle", moodT:0, time:0 };

// ---------- reliable taps (some app web views drop click events) ----------
function onTap(el, fn){
  let last = 0;   // per-button guard so one tap firing both pointerup and click only counts once
  const run = e => { const now = Date.now(); if(now - last < 400) return; last = now; e.preventDefault(); fn(e); };
  el.addEventListener("pointerup", e => { if(e.pointerType !== "mouse" || e.button === 0) run(e); });
  el.addEventListener("click", run);
}

// ---------- level picker ----------
function pickLevel(i){
  chosen = i;
  document.querySelectorAll(".lvl").forEach((x,j)=>{ x.classList.toggle("sel", j===i); x.setAttribute("aria-pressed", j===i); });
  const L = LEVELS[i];
  $("pickInfo").innerHTML = `<strong>${L.dest}</strong> · words with ${L.desc}`;
  $("startBtn").textContent = `Blast off to ${L.dest}!`;
}
function renderLevels(){
  const box = $("levels"); box.innerHTML = "";
  LEVELS.forEach((L,i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "lvl"; b.id = "lvl"+i;
    const st = best[i] ? "★".repeat(best[i]) : "";
    b.innerHTML = `<canvas width="112" height="112" aria-hidden="true"></canvas><span class="n">${L.dest}</span><span class="d">${L.desc}</span><span class="d st">${st || "&nbsp;"}</span>`;
    const pc = b.querySelector("canvas").getContext("2d");
    drawPlanet(pc, 56, 56, 26, L);
    onTap(b, () => { pickLevel(i); tone(520 + i*60, .08, "sine", 0, .08); });
    box.appendChild(b);
  });
  pickLevel(chosen);
}

// ---------- sound ----------
let ac = null;
function audio(){ try { ac = ac || new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==="suspended") ac.resume(); } catch(e){} }
function tone(f, d=.12, type="sine", slide=0, vol=.15){
  if(!ac) return;
  try{
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;

// ---------- rocks ----------
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function makeShape(){ const n=11, pts=[]; for(let i=0;i<n;i++){ pts.push(0.82+Math.random()*0.22); } return pts; }
function maxAtOnce(){ const mx = LEVELS[S.level].max; return W < 560 ? Math.min(mx, 2) : mx; }  // phones fit two word labels side by side, not three
function speedAt(i){ return 1 + (TOP_SPEED-1) * Math.pow(i/(PER_LEVEL-1), 1.3); }
function spawn(){
  const [word, emoji] = S.queue.shift();
  const L = LEVELS[S.level];
  const spd = speedAt(S.spawned); S.spawned++;
  $("spd").textContent = `Speed ${spd.toFixed(1)}×`;
  if(S.spawned === Math.ceil(PER_LEVEL/2)) talk(`Hold on tight! We're speeding up!`, "think");
  if(S.spawned === PER_LEVEL) talk(`Last one! ${L.dest} is right there!`, "think");
  const live = S.rocks.filter(r=>r.state==="fly");
  // each asteroid gets its own lane so a wave never stacks up
  const narrow = W < 560;
  const LANES = { 1:[[0,-.02]], 2: narrow ? [[-.2,.1],[.2,-.15]] : [[-.24,0],[.24,-.06]], 3:[[-.3,.02],[.3,.02],[0,-.17]] }[maxAtOnce()];
  const free = LANES.map((ln,i)=>i).filter(i=>!live.some(r=>r.lane===i));
  const lane = free.length ? free[Math.random()*free.length|0] : 0;
  const [lx, ly] = LANES[lane], jit = LANES.length===1 ? .22 : .04;
  S.rocks.push({ word, emoji, lane, ox: lx + (Math.random()*2-1)*jit, oy: ly + (Math.random()*2-1)*.03, t:0,
    dur:(6 + word.length*1.1) * L.pace * (1 + 0.25*(L.max-1)) / spd, shape:makeShape(), rot:Math.random()*6, spin:(Math.random()-.5)*.6,
    state:"fly", boomT:0 });
}
function winGeom(){ return { cx: W/2, cy: H*0.46, R: Math.min(W*0.62, H*0.56) }; }
function rockGeom(r){
  const p = Math.min(1, r.t/r.dur), m = Math.min(W,H);
  const e = p*p*(1.2-0.2*p);                      // eases in so it feels like it rushes closer
  const rad = m*(0.07 + 0.24*e);
  const spread = 0.55 + 0.75*e;
  const w = winGeom();
  return { p, rad, x: w.cx + r.ox*w.R*2*spread, y: w.cy - w.R*0.14 + r.oy*w.R*2*spread };
}
const flying = () => S.rocks.filter(r=>r.state==="fly");
function target(){
  if(!S.typed) return null;
  return flying().filter(r=>r.word.startsWith(S.typed)).sort((a,b)=>b.t/b.dur - a.t/a.dur)[0] || null;
}
function hintCount(r, p){
  let h = 0;
  if(S.level===0) h = 1;
  if(p > .5) h = Math.max(h,1);
  if(p > .75 && S.level <= 3) h = 2;
  if(p > .75 && S.level > 3) h = Math.ceil(r.word.length/3);
  return h;
}

  S.resolved = 0; S.spawned = 0; S.prog = 0; S.rocks = []; S.beams = []; S.parts = []; S.log = []; S.typed = ""; inp.value = "";

function endLevel(won){

  const next = $("nextBtn");

    best[S.level] = Math.max(best[S.level]||0, st);
    try{ localStorage.setItem("wordzap-stars", JSON.stringify(best)); }catch(e){}

function zap(r){
  const g = rockGeom(r);
  r.state = "boom"; r.boomT = 0;
  const lay = layout();
  S.aim = clampAim(Math.atan2(g.x - lay.tx, lay.ty - g.y)); S.recoil = 1; S.zapT = 1;
  S.beams.push({x:g.x, y:g.y, t:0});

    const a = Math.random()*Math.PI*2, v = 80 + Math.random()*260;
    S.parts.push({x:g.x,y:g.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.7+Math.random()*.5,t:0,
      c:["#f6b54a","#5ff2c2","#ffffff","#c79a6b"][i%4], s:2+Math.random()*4});
  }
  const pts = 10*r.word.length + Math.round((1-g.p)*20);

  const cheers = ["Zap!","Got it!","Bullseye!","Super!","Kaboom!","Nice one!"];

}

  say(r.word);
  if(S.typed && !flying().some(x=>x.word.startsWith(S.typed))){ S.typed=""; inp.value=""; }

inp.addEventListener("input", () => {
  let v = inp.value.toLowerCase().replace(/[^a-z]/g,"");
  if(S.mode!=="play"){ inp.value=""; return; }
  const live = flying();
  if(v && !live.some(r=>r.word.startsWith(v))){
    // allow starting over on a different asteroid with a fresh first letter
    const last = v.slice(-1);
    if(v.length > S.typed.length && live.some(r=>r.word.startsWith(last)) && !live.some(r=>r.word.startsWith(S.typed+last))) v = last;

  const done = live.filter(r=>r.word===v).sort((a,b)=>b.t/b.dur-a.t/a.dur)[0];
  if(done){ zap(done); S.typed=""; inp.value=""; }
  updatePower();

// ---------- drawing ----------
function drawStars(dt){
  const speed = S.mode==="play" ? .3*(1+S.prog*(TOP_SPEED-1)*1.4) : .12, cx=W/2, cy=H*0.46, m=Math.max(W,H)*0.55;
  for(const s of stars){
    s.z -= dt*speed;
    if(s.z<=0.02){ s.x=Math.random()*2-1; s.y=Math.random()*2-1; s.z=1; }
    const x = cx + s.x/s.z*m*0.5, y = cy + s.y/s.z*m*0.5;
    const pz = s.z + dt*speed*2.5, px = cx + s.x/pz*m*0.5, py = cy + s.y/pz*m*0.5;
    const a = Math.min(1,(1-s.z)*1.4);
    ctx.strokeStyle = `rgba(220,226,255,${a})`; ctx.lineWidth = Math.max(.6,(1-s.z)*2.4);
    ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(x,y); ctx.stroke();
  }
}
function drawRock(r){
  const g = rockGeom(r); let {x,y,rad,p} = g;
  if(r.state==="boom"){ rad *= 1 + r.boomT*1.5; ctx.globalAlpha = Math.max(0,1-r.boomT*3); }
  ctx.save(); ctx.translate(x,y); ctx.rotate(r.rot);
  // rock body
  ctx.beginPath();
  r.shape.forEach((k,i)=>{ const a=i/r.shape.length*Math.PI*2; const px=Math.cos(a)*rad*k, py=Math.sin(a)*rad*k; i?ctx.lineTo(px,py):ctx.moveTo(px,py); });
  ctx.closePath();
  const grd = ctx.createRadialGradient(-rad*.35,-rad*.35,rad*.1,0,0,rad*1.1);
  grd.addColorStop(0,"#9b8a7a"); grd.addColorStop(1,"#4a3f3a");
  ctx.fillStyle = grd; ctx.fill();
  const danger = p > .78 && r.state==="fly";
  ctx.lineWidth = Math.max(2,rad*.05);
  ctx.strokeStyle = danger ? `rgba(255,107,107,${.6+.4*Math.sin(S.time*14)})` : "#2c2522"; ctx.stroke();
  // craters
  ctx.fillStyle = "rgba(40,32,28,.45)";
  [[.5,-.45,.13],[-.55,.35,.1],[.35,.55,.08]].forEach(([a,b,c])=>{ ctx.beginPath(); ctx.arc(a*rad,b*rad,c*rad,0,7); ctx.fill(); });
  ctx.restore();
  // picture window
  ctx.save(); ctx.translate(x,y);
  ctx.beginPath(); ctx.arc(0,0,rad*.62,0,7); ctx.fillStyle="rgba(240,236,255,.92)"; ctx.fill();
  ctx.lineWidth=Math.max(2,rad*.06); ctx.strokeStyle="#f6b54a"; ctx.stroke();
  ctx.font = `${rad*.78}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(r.emoji,0,rad*.05);
  ctx.restore(); ctx.globalAlpha = 1;
}
function drawLabel(r){
  if(r.state!=="fly") return;
  const {x,y,rad,p} = rockGeom(r);
  const tg = target(), typed = tg===r ? S.typed : "", hc = hintCount(r,p);
  const fs = Math.min(Math.max(18, Math.min(34, rad*.42)), (W*0.46)/(r.word.length*0.82 + 1.3)), gap = fs*.82;
  const total = (r.word.length-1)*gap, ly = y + rad + fs*1.05;
  ctx.font = `700 ${fs}px "Atkinson Hyperlegible",system-ui,sans-serif`; ctx.textAlign="center"; ctx.textBaseline="alphabetic";
  const bw = total + fs*1.3;
  ctx.fillStyle = "rgba(11,15,42,.75)"; roundRect(x-bw/2, ly-fs*1.05, bw, fs*1.45, fs*.4); ctx.fill();
  [...r.word].forEach((ch,i)=>{
    const lx = x - total/2 + i*gap;
    if(i < typed.length){ ctx.fillStyle="#5ff2c2"; ctx.fillText(ch,lx,ly); }
    else if(i < hc){ ctx.fillStyle="rgba(246,181,74,.75)"; ctx.fillText(ch,lx,ly); }
    else { ctx.fillStyle="rgba(154,162,214,.9)"; ctx.fillRect(lx-fs*.28, ly+2, fs*.56, 3); }
  });
}
function drawDestination(){
  const L = LEVELS[S.mode==="title" ? chosen : S.level], m = Math.min(W,H);
  const pr = S.mode==="title" ? 0 : S.prog;
  ctx.save(); ctx.globalAlpha = .92;
  const w = winGeom();
  drawPlanet(ctx, w.cx + w.R*(0.42 - 0.3*pr), w.cy - w.R*(0.55 - 0.2*pr), m*(0.045 + 0.28*pr*pr), L);
  ctx.restore();
}
function drawPlanet(c, x, y, r, L){
  const ring = L.look==="ring" || L.look==="tilt";
  const tilt = L.look==="tilt" ? 1.25 : -.3;
  c.save();
  if(ring){ c.strokeStyle = L.look==="tilt" ? "rgba(200,245,245,.45)" : "rgba(246,220,160,.75)"; c.lineWidth=Math.max(2,r*.14); c.beginPath(); c.ellipse(x,y,r*1.75,r*.42,tilt,Math.PI,Math.PI*2); c.stroke(); }
  const g = c.createRadialGradient(x-r*.35,y-r*.35,r*.1,x,y,r);
  g.addColorStop(0,L.col[0]); g.addColorStop(1,L.col[1]);
  c.fillStyle=g; c.beginPath(); c.arc(x,y,r,0,7); c.fill();
  c.save(); c.beginPath(); c.arc(x,y,r,0,7); c.clip();
  if(L.look==="bands"){ for(let i=-4;i<=4;i++){ c.fillStyle = i%2 ? "rgba(150,80,40,.35)" : "rgba(255,240,220,.2)"; c.fillRect(x-r, y+i*r*.22-r*.07, r*2, r*.13); }
    c.fillStyle="rgba(200,90,60,.7)"; c.beginPath(); c.ellipse(x+r*.3,y+r*.3,r*.18,r*.1,0,0,7); c.fill(); }
  if(L.look==="earth"){ c.fillStyle="#4caf6a"; [[-.3,-.2,.35,.25],[.35,.15,.3,.4],[-.2,.5,.25,.15]].forEach(([a,b,d,e])=>{ c.beginPath(); c.ellipse(x+a*r,y+b*r,d*r,e*r,.4,0,7); c.fill(); });
    c.fillStyle="rgba(255,255,255,.5)"; c.beginPath(); c.ellipse(x,y-r*.85,r*.5,r*.15,0,0,7); c.fill(); }
  if(L.look==="craters"){ c.fillStyle="rgba(0,0,0,.18)"; [[-.3,-.2,.18],[.3,.25,.14],[.1,-.45,.1],[-.35,.4,.12]].forEach(([a,b,d])=>{ c.beginPath(); c.arc(x+a*r,y+b*r,d*r,0,7); c.fill(); }); }
  if(L.look==="haze"){ c.fillStyle="rgba(255,255,255,.15)"; [-.4,0,.4].forEach(b=>{ c.beginPath(); c.ellipse(x,y+b*r,r,r*.08,0,0,7); c.fill(); }); }
  c.restore();
  if(ring){ c.beginPath(); c.ellipse(x,y,r*1.75,r*.42,tilt,0,Math.PI); c.stroke(); }
  c.restore();
}
function roundRect(x,y,w,h,r){ rr(ctx,x,y,w,h,r); }
function rr(c,x,y,w,h,r){ const ctx = c; ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function drawCockpit(){
  // round TIE-style viewport: dark hull all around, eight spokes and an inner ring
  const { cx, cy, R } = winGeom(), lw = Math.max(4, R*0.024), rI = R*0.66;
  ctx.fillStyle = "#191d30"; ctx.beginPath(); ctx.rect(0,0,W,H); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.fill("evenodd");
  ctx.strokeStyle = "#262b45"; ctx.lineWidth = 2;
  for(let i=0;i<12;i++){ const a = i*Math.PI/6 + Math.PI/12; ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*(R+lw*2), cy+Math.sin(a)*(R+lw*2)); ctx.lineTo(cx+Math.cos(a)*R*3, cy+Math.sin(a)*R*3); ctx.stroke(); }
  [1.25, 1.6].forEach(f => { ctx.beginPath(); ctx.arc(cx, cy, R*f, 0, 7); ctx.stroke(); });
  const strut = (draw) => { ctx.strokeStyle = "#2d3352"; ctx.lineWidth = lw; draw(); ctx.strokeStyle = "rgba(140,150,210,.35)"; ctx.lineWidth = Math.max(1, lw*0.25); draw(); };
  for(let i=0;i<8;i++){
    const a = i*Math.PI/4 - Math.PI/2;
    strut(() => { ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*rI, cy+Math.sin(a)*rI); ctx.lineTo(cx+Math.cos(a)*R, cy+Math.sin(a)*R); ctx.stroke(); });
  }
  strut(() => { ctx.beginPath(); ctx.arc(cx, cy, rI, 0, 7); ctx.stroke(); });
  ctx.strokeStyle = "#3a4166"; ctx.lineWidth = lw*1.8; ctx.beginPath(); ctx.arc(cx, cy, R + lw*0.4, 0, 7); ctx.stroke();
  ctx.strokeStyle = "rgba(140,150,210,.4)"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(cx, cy, R - lw*0.4, 0, 7); ctx.stroke();
  ctx.fillStyle = "#5a628f";
  for(let i=0;i<24;i++){ const a = i*Math.PI/12; ctx.beginPath(); ctx.arc(cx+Math.cos(a)*(R+lw*0.4), cy+Math.sin(a)*(R+lw*0.4), Math.max(1.5, lw*0.18), 0, 7); ctx.fill(); }
}
function drawBeams(dt){
  S.beams = S.beams.filter(b=>(b.t+=dt) < .28);
  const [sx,sy] = turretTip();
  for(const b of S.beams){
    const a = 1-b.t/.28;
    [[12,"95,242,194"],[4,"255,255,255"]].forEach(([w,c])=>{
      ctx.strokeStyle=`rgba(${c},${a})`; ctx.lineWidth=w*a; ctx.lineCap="round";
      ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(b.x,b.y); ctx.stroke();
    });
    ctx.fillStyle=`rgba(255,255,255,${a})`; ctx.beginPath(); ctx.arc(sx,sy,10*a,0,7); ctx.fill();
  }
}
function drawParts(dt){
  S.parts = S.parts.filter(q=>(q.t+=dt) < q.life);
  for(const q of S.parts){
    q.x+=q.vx*dt; q.y+=q.vy*dt; q.vx*=.98; q.vy*=.98;
    ctx.globalAlpha = 1-q.t/q.life; ctx.fillStyle=q.c;
    ctx.beginPath(); ctx.arc(q.x,q.y,q.s,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;
}

// ---------- cockpit interior: nose turret, console, Captain Cubby from behind ----------
function layout(){
  const m = Math.min(W,H), ct = H - m*0.17;            // ct = top edge of the console
  return { m, ct, tx: W/2 + m*0.06, ty: ct - m*0.06, bx: W/2 - m*0.22, by: ct - m*0.02, br: m*0.082 };
}
const clampAim = a => Math.max(-1.35, Math.min(1.35, a));
function turretTip(){ const g = layout(), L = g.m*0.15*(1-0.15*S.recoil); return [g.tx + Math.sin(S.aim)*L, g.ty - Math.cos(S.aim)*L]; }
function aimTarget(){ return target() || flying().sort((a,b)=>b.t/b.dur-a.t/a.dur)[0] || null; }

function drawNoseTurret(dt){
  const g = layout(), m = g.m, tr = aimTarget();
  let want = 0;
  if(tr){ const k = rockGeom(tr); want = clampAim(Math.atan2(k.x - g.tx, g.ty - k.y)); }
  S.aim += (want - S.aim) * Math.min(1, dt*7);
  S.recoil = Math.max(0, S.recoil - dt*4);
  // ship's nose, seen through the bottom of the windscreen
  const ng = ctx.createLinearGradient(0, g.ct - m*.1, 0, g.ct + m*.05);
  ng.addColorStop(0,"#6a74b8"); ng.addColorStop(1,"#2a3166");
  ctx.fillStyle = ng; ctx.beginPath(); ctx.ellipse(W/2, g.ct + m*.06, m*.62, m*.15, 0, Math.PI, 0); ctx.fill();
  ctx.strokeStyle = "#f6b54a"; ctx.lineWidth = Math.max(2, m*.007);
  ctx.beginPath(); ctx.ellipse(W/2, g.ct + m*.06, m*.5, m*.1, 0, Math.PI*1.1, Math.PI*1.9); ctx.stroke();
  // twin barrels
  const bl = m*0.15*(1-0.15*S.recoil), bw = m*0.024;
  ctx.save(); ctx.translate(g.tx, g.ty); ctx.rotate(S.aim);
  [-1,1].forEach(sd=>{
    ctx.fillStyle="#2b3160"; roundRect(sd*m*0.022 - bw/2, -bl, bw, bl, bw/2); ctx.fill();
    ctx.fillStyle="#8a93d8"; ctx.fillRect(sd*m*0.022 - bw/2, -bl*0.55, bw, bw*0.5);
    ctx.globalAlpha = Math.min(1, .55 + .35*Math.sin(S.time*6) + S.recoil);
    ctx.fillStyle="#5ff2c2"; ctx.beginPath(); ctx.arc(sd*m*0.022, -bl + bw*0.4, bw*0.42, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  });
  ctx.restore();
  // turret dome
  const dg = ctx.createRadialGradient(g.tx - m*.02, g.ty - m*.03, m*.005, g.tx, g.ty, m*.07);
  dg.addColorStop(0,"#b6befa"); dg.addColorStop(1,"#3a4384");
  ctx.fillStyle = dg; ctx.beginPath(); ctx.arc(g.tx, g.ty, m*.06, Math.PI, 0);
  ctx.lineTo(g.tx + m*.075, g.ty + m*.03); ctx.lineTo(g.tx - m*.075, g.ty + m*.03); ctx.closePath(); ctx.fill();
  ctx.fillStyle="#f6b54a"; ctx.beginPath(); ctx.arc(g.tx, g.ty - m*.02, m*.012, 0, 7); ctx.fill();
}

function drawConsole(){
  const g = layout(), m = g.m;
  const cg = ctx.createLinearGradient(0, g.ct, 0, H);
  cg.addColorStop(0,"#2c3470"); cg.addColorStop(1,"#141838");
  ctx.fillStyle = cg; ctx.beginPath();
  ctx.moveTo(0, g.ct + m*.03); ctx.quadraticCurveTo(W/2, g.ct - m*.035, W, g.ct + m*.03);
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
  ctx.strokeStyle="#4a54a0"; ctx.lineWidth=3; ctx.beginPath();
  ctx.moveTo(0, g.ct + m*.03); ctx.quadraticCurveTo(W/2, g.ct - m*.035, W, g.ct + m*.03); ctx.stroke();
  // radar: shows every incoming asteroid
  const rx = W/2 + m*0.3, ry = g.ct + m*0.095, rr = m*0.058;
  ctx.fillStyle="#08202a"; ctx.beginPath(); ctx.arc(rx, ry, rr, 0, 7); ctx.fill();
  ctx.strokeStyle="rgba(95,242,194,.5)"; ctx.lineWidth=1.5;
  [1,.6].forEach(f=>{ ctx.beginPath(); ctx.arc(rx, ry, rr*f, 0, 7); ctx.stroke(); });
  const sw = S.time*2.2; ctx.strokeStyle="rgba(95,242,194,.8)";
  ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx + Math.cos(sw)*rr, ry + Math.sin(sw)*rr); ctx.stroke();
  for(const r of flying()){
    const k = rockGeom(r), px = rx + (k.x - W/2)/W*rr*1.6, py = ry - rr*0.8 + rr*1.5*k.p;
    ctx.fillStyle = k.p > .78 ? "#ff6b6b" : "#f6b54a"; ctx.beginPath(); ctx.arc(px, py, Math.max(2, rr*.1), 0, 7); ctx.fill();
  }
  // banks of buttons, lights and toggle switches across the console
  const rx2 = W/2 + m*0.3, ry2 = g.ct + m*0.095, step = Math.max(14, m*0.042);
  const cols = ["#5ff2c2","#f6b54a","#ff6b6b","#8fb0ff","#c58bff"];
  let n = 0;
  for(let row=0; row<3; row++){
    const y = g.ct + m*0.07 + row*step*1.05;
    if(y > H - step*0.4) break;
    for(let x = step*0.8 + (row%2)*step*0.5; x < W - step*0.5; x += step){
      n++;
      if(Math.hypot(x - rx2, y - ry2) < m*0.075) continue;           // leave room for the radar
      const kind = (n*7) % 5, col = cols[(n*3) % cols.length];
      const on = Math.sin(S.time*(1.5 + (n%4)*.7) + n*1.9) > -.2;
      if(kind===0){                                                    // toggle switch
        ctx.fillStyle="#1b1f45"; roundRect(x - step*.18, y - step*.28, step*.36, step*.56, step*.1); ctx.fill();
        ctx.fillStyle="#d7dcf5"; roundRect(x - step*.12, y + (on ? -step*.24 : 0), step*.24, step*.24, step*.06); ctx.fill();
      } else if(kind===1){                                             // square push button
        ctx.fillStyle = on ? col : "#3a4384"; roundRect(x - step*.22, y - step*.18, step*.44, step*.36, step*.08); ctx.fill();
      } else {                                                         // round light
        ctx.fillStyle = on ? col : "#3a4384"; ctx.beginPath(); ctx.arc(x, y, step*.17, 0, 7); ctx.fill();
        if(on){ ctx.fillStyle="rgba(255,255,255,.45)"; ctx.beginPath(); ctx.arc(x - step*.05, y - step*.05, step*.05, 0, 7); ctx.fill(); }
      }
    }
  }
}

// Teddy's colours, smooth cartoon fill; white spacesuit with honey trim
const TAN="#d9b48b", TAN_HI="#e8cba6", TAN_D="#c29a6f", EAR="#b58858", EAR_IN="#946843", MUZ="#f1dfc2", NOSE="#4b2a24", EYE="#2a1915";
const SUIT="#eef1fb", SUIT_SH="#c6cce6", SUIT_LINE="#8e98cf", BOOT="#5e67a6";
function furHead(c, x, y, rx, ry){

  g.addColorStop(0, TAN_HI); g.addColorStop(1, TAN_D);
  c.fillStyle = g; c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, 7); c.fill();
}

function drawCubbyFront(cv, t, mood){
  const c = cv.getContext("2d"), k = cv.width/440;

    c.fillStyle=SUIT; c.beginPath(); c.ellipse(x, 372, 32, 40, d*.1, 0, 7); c.fill();
    c.strokeStyle=SUIT_SH; c.lineWidth=3; c.stroke();
    c.fillStyle="#f6b54a"; rr(c, x-31, 386, 62, 9, 4); c.fill();
    c.fillStyle=BOOT; c.beginPath(); c.ellipse(x + d*4, 410, 36, 20, 0, 0, 7); c.fill();
  });

  const torso = () => { c.beginPath(); c.moveTo(172,248); c.bezierCurveTo(146,292,140,368,186,390); c.lineTo(254,390); c.bezierCurveTo(300,368,294,292,268,248); c.closePath(); };
  c.fillStyle=SUIT; torso(); c.fill();
  c.save(); torso(); c.clip();
  c.fillStyle=SUIT_SH; c.beginPath(); c.ellipse(300,330,44,100,0,0,7); c.fill();
  c.fillStyle=SUIT_LINE; c.fillRect(130,352,180,9);
  c.restore();
  c.strokeStyle=SUIT_SH; c.lineWidth=3; torso(); c.stroke();
  // chest control panel and mission patch
  c.fillStyle="#2a3166"; rr(c, 196, 284, 48, 32, 8); c.fill();
  ["#5ff2c2","#f6b54a","#ff6b6b"].forEach((col,i)=>{ c.fillStyle = Math.sin(t*3+i*2) > -.3 ? col : "#4a528a"; c.beginPath(); c.arc(208 + i*12, 300, 4.5, 0, 7); c.fill(); });
  c.fillStyle="#3b5bd6"; c.beginPath(); c.arc(176, 290, 11, 0, 7); c.fill();
  c.fillStyle="#f6b54a"; c.font="700 14px system-ui,sans-serif"; c.textAlign="center"; c.textBaseline="middle"; c.fillText("★", 176, 291);
  // long tube arms like Teddy's; raised arms are drawn after the head so they stay in front
  const arm = (x, y, a) => { c.save(); c.translate(x, y); c.rotate(a);
    c.fillStyle=SUIT; rr(c, -22, -6, 44, 112, 22); c.fill(); c.strokeStyle=SUIT_SH; c.lineWidth=3; c.stroke();
    c.fillStyle="#f6b54a"; rr(c, -23, 92, 46, 10, 4); c.fill();
    c.fillStyle=TAN; c.beginPath(); c.arc(0, 116, 21, 0, 7); c.fill();

    c.restore(); };
  const raised = [];
  if(mood==="happy"){ raised.push([168,262, 2.5+Math.sin(t*9)*.18], [272,262,-2.5-Math.sin(t*9)*.18]); }
  else if(mood==="sad"){ arm(168,264,.12); arm(272,264,-.12); }
  else { arm(168,264,.38); raised.push([272,262,-2.45+Math.sin(t*7)*.3]); }
  // suit collar
  c.fillStyle=SUIT_LINE; c.beginPath(); c.ellipse(220, 250, 62, 15, 0, 0, 7); c.fill();
  c.fillStyle="#b9c1ea"; c.beginPath(); c.ellipse(220, 246, 54, 10, 0, 0, 7); c.fill();
  // ears, head, muzzle

    c.fillStyle=EAR_IN; c.beginPath(); c.arc(x+(x<220?7:-7),y+7,22,0,7); c.fill(); });
  furHead(c, 220, 152, 120, 106);
  c.fillStyle="rgba(255,128,128,.3)"; [[140,196],[300,196]].forEach(([x,y])=>{ c.beginPath(); c.ellipse(x,y,20,12,0,0,7); c.fill(); });
  const blink = (t % 3.6) < .13 && mood!=="happy";
  [[166,150],[274,150]].forEach(([x,y])=>{
    c.strokeStyle=EYE; c.fillStyle=EYE; c.lineWidth=5; c.lineCap="round";
    if(mood==="happy"){ c.beginPath(); c.arc(x,y+6,15,Math.PI*1.15,Math.PI*1.85); c.stroke(); }

    else {
      c.beginPath(); c.ellipse(x,y,15,19,0,0,7); c.fill();
      c.fillStyle="#fff"; c.beginPath(); c.arc(x+6,y-7,6,0,7); c.fill(); c.beginPath(); c.arc(x-5,y+7,3,0,7); c.fill();

  c.fillStyle="rgba(255,255,255,.45)"; c.beginPath(); c.ellipse(212,189,6,4,-.3,0,7); c.fill();

    if(!talking){ c.fillStyle="#ff9a9a"; c.beginPath(); c.ellipse(220,239,10,6,0,0,7); c.fill(); } }

  else { c.beginPath(); c.moveTo(197,221); c.quadraticCurveTo(208,234,220,223); c.quadraticCurveTo(232,234,243,221); c.stroke(); }
  raised.forEach(a => arm(...a));
}

function drawBearBack(){
  const g = layout(), r = g.br, bx = g.bx, by = g.by, t = S.time;
  const mood = S.moodT > 0 ? S.mood : "idle", f = Math.min(1, S.moodT);
  let hx = 0, hy = Math.sin(t*2)*r*.03, tilt = 0;
  if(mood==="ouch") hx = Math.sin(t*45)*r*.1*f;
  if(mood==="think") tilt = -.2;
  if(mood==="happy") hy -= Math.abs(Math.sin(t*10))*r*.15*f;
  const cheer = mood==="happy" && S.moodT > .7;

  // control wheel, set forward and to the right of Cubby's head; it turns as the turret aims
  const yx = bx + r*1.45, yy = by - r*0.02 - (S.zapT > 0 ? r*.06*S.zapT : 0);
  const yr = S.aim*0.25 + (mood==="ouch" ? Math.sin(t*40)*.18*f : 0), hw = r*0.82;
  const ol = Math.max(1.5, r*.06);
  const part = (x,y,w,h,rad,fill) => { roundRect(x,y,w,h,rad); ctx.fillStyle=fill; ctx.fill(); ctx.strokeStyle="#1b1f45"; ctx.lineWidth=ol; ctx.stroke(); };
  const grip = sd => { const lx = sd*hw, ly = -r*.5; return [yx + lx*Math.cos(yr) - ly*Math.sin(yr), yy + lx*Math.sin(yr) + ly*Math.cos(yr)]; };
  part(yx - r*.12, yy, r*.24, r*1.6, r*.08, "#8e98cf");                    // column into the console

  // spacesuit back
  ctx.fillStyle=SUIT; roundRect(bx - r*.85, by + r*.75, r*1.7, r*2.4, r*.55); ctx.fill();
  ctx.strokeStyle=SUIT_SH; ctx.lineWidth=Math.max(1.5, r*.05); ctx.stroke();

  // arms reach forward (drawn first so the wheel sits over them)
  const paws = [];
  [-1,1].forEach(sd=>{
    const sx = bx + sd*r*0.72, sy = by + r*1.05;
    let [px, py] = grip(sd);
    if(cheer){ px = bx + sd*r*1.5; py = by - r*0.85; }
    ctx.lineCap="round";
    ctx.strokeStyle=SUIT_SH; ctx.lineWidth = r*0.44; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(px, py); ctx.stroke();
    ctx.strokeStyle=SUIT; ctx.lineWidth = r*0.36; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(px, py); ctx.stroke();
    paws.push([px, py]);
  });

  // the wheel itself
  ctx.save(); ctx.translate(yx, yy); ctx.rotate(yr);
  part(-hw, -r*.12, hw*2, r*.24, r*.12, "#d7dcf5");                        // crossbar
  [-1,1].forEach(sd=>{
    part(sd*hw - r*.15, -r*.75, r*.3, r*.9, r*.15, "#d7dcf5");            // handles
    part(sd*hw - r*.15, -r*.75, r*.3, r*.3, r*.12, "#f6b54a");            // grips
  });
  ctx.fillStyle="#3b5bd6"; ctx.beginPath(); ctx.arc(0, 0, r*.3, 0, 7); ctx.fill(); ctx.strokeStyle="#1b1f45"; ctx.lineWidth=ol; ctx.stroke();
  ctx.fillStyle="#f6b54a"; ctx.font=`700 ${r*.34}px system-ui,sans-serif`; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("★", 0, r*.02);
  ctx.restore();

  // paws on the grips
  paws.forEach(([px,py])=>{
    ctx.fillStyle="#f6b54a"; ctx.beginPath(); ctx.arc(px, py, r*0.23, 0, 7); ctx.fill();
    ctx.fillStyle=TAN; ctx.beginPath(); ctx.arc(px, py, r*0.18, 0, 7); ctx.fill();
  });

  // pilot seat in front of us, Cubby's shoulders and head above it
  ctx.fillStyle="#232747"; roundRect(bx - r*1.45, by + r*1.0, r*2.9, r*3, r*.6); ctx.fill();
  ctx.fillStyle="#30365f"; roundRect(bx - r*1.15, by + r*1.15, r*2.3, r*2.8, r*.45); ctx.fill();
  ctx.strokeStyle="#f6b54a"; ctx.lineWidth=Math.max(1.5, r*.06); roundRect(bx - r*.92, by + r*1.32, r*1.84, r*2.6, r*.32); ctx.stroke();
  ctx.strokeStyle="rgba(255,255,255,.09)"; ctx.lineWidth=Math.max(1, r*.04);
  [-.45, 0, .45].forEach(dx=>{ ctx.beginPath(); ctx.moveTo(bx + dx*r, by + r*1.45); ctx.lineTo(bx + dx*r, by + r*3.8); ctx.stroke(); });

  // collar
  ctx.fillStyle=SUIT_LINE; ctx.beginPath(); ctx.ellipse(bx, by + r*0.82, r*0.72, r*0.19, 0, 0, 7); ctx.fill();
  // head from behind: smooth fur, no hat
  ctx.save(); ctx.translate(bx + hx, by + hy); ctx.rotate(tilt);
  [-1,1].forEach(sd=>{ ctx.fillStyle=EAR; ctx.beginPath(); ctx.arc(sd*r*0.74, -r*0.62, r*0.32, 0, 7); ctx.fill(); });
  furHead(ctx, 0, 0, r*1.05, r*0.94);
  ctx.fillStyle="rgba(120,80,45,.12)"; ctx.beginPath(); ctx.ellipse(0, r*.5, r*.85, r*.35, 0, 0, Math.PI); ctx.fill();
  ctx.restore();
}

// ---------- loop ----------
let last = performance.now();
function frame(now){
  const dt = Math.min(.05,(now-last)/1000); last = now; S.time += dt;
  if(S.moodT>0) S.moodT -= dt;
  if(S.zapT>0) S.zapT -= dt*3;

  if(S.mode==="play"){
    const L = LEVELS[S.level];
    S.spawnTimer -= dt;
    if(S.queue.length && flying().length < maxAtOnce() && S.spawnTimer<=0){ spawn(); S.spawnTimer = (2.6 + Math.random()*1.4) / speedAt(S.spawned); }
    for(const r of S.rocks){
      if(r.state==="fly"){ r.t += dt; r.rot += r.spin*dt; if(r.t>=r.dur) hit(r); }
      else if(r.state==="boom"){ r.boomT += dt; if(r.boomT>.4) r.state="gone"; }
    }
    S.rocks = S.rocks.filter(r=>r.state!=="gone");
    const goal = S.resolved / PER_LEVEL;
    S.prog += (goal - S.prog) * Math.min(1, dt*2);
    $("jfill").style.width = (S.prog*100)+"%"; $("jship").style.left = (S.prog*100)+"%";
    if(S.hp>0 && S.resolved>=PER_LEVEL && !S.rocks.length && S.parts.length===0) endLevel(true);
  }

  ctx.setTransform(DPR,0,0,DPR,0,0);
  const bg = ctx.createRadialGradient(W/2,H*0.44,0,W/2,H*0.44,Math.max(W,H)*0.8);
  bg.addColorStop(0,"#1a1f55"); bg.addColorStop(1,"#0b0f2a");
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
  if(S.shake>0){ S.shake-=dt; ctx.translate((Math.random()-.5)*18*S.shake,(Math.random()-.5)*18*S.shake); }
  drawStars(dt);
  drawDestination();
  const order = [...S.rocks].sort((a,b)=>a.t/a.dur-b.t/b.dur);
  order.forEach(drawRock);
  drawParts(dt);
  drawCockpit();
  drawNoseTurret(dt);        // chin turret sits in front of the viewport rim so it is always visible
  drawBeams(dt);
  drawConsole(); drawBearBack();
  order.forEach(drawLabel);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(S.flash>0){ S.flash-=dt; ctx.fillStyle=`rgba(255,107,107,${S.flash})`; ctx.fillRect(0,0,W,H); }
  if(!$("titleScreen").hidden) drawCubbyFront($("cubby"), S.time, S.moodT > 0 && S.mood==="talk" ? "talk" : "wave");
  if(!$("endScreen").hidden) drawCubbyFront($("cubbyEnd"), S.time, S.endMood);
  requestAnimationFrame(frame);
}
renderLevels(); showStory(0, false); updateHud(); requestAnimationFrame(frame);
})();
</script>
